<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IFP Float English</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app" aria-labelledby="app-title">
      <header class="topbar">
        <h1 id="app-title">English Tutor</h1>
        <div class="toolbar" aria-label="Page tools">
          <button id="pasteButton" class="icon-button" type="button" title="Paste from clipboard" aria-label="Paste from clipboard">p</button>
          <button id="randomWordButton" class="icon-button" type="button" title="New random word" aria-label="New random word">r</button>
          <button id="zoomOutButton" class="icon-button" type="button" title="Zoom out" aria-label="Zoom out">-</button>
          <button id="zoomInButton" class="icon-button" type="button" title="Zoom in" aria-label="Zoom in">+</button>
          <button id="clearHistoryButton" class="icon-button" type="button" title="Clear recent words" aria-label="Clear recent words">x</button>
        </div>
      </header>

      <section class="controls" aria-label="Word controls">
        <select id="classSelect" aria-label="Class"></select>
        <select id="subjectSelect" aria-label="Subject">
          <option>English</option>
          <option>Math</option>
          <option>Science</option>
          <option>Social</option>
        </select>
        <input id="wordInput" type="text" autocomplete="off" spellcheck="false" placeholder="Word" aria-label="Word" aria-describedby="lookupStatus">
      </section>

      <div id="suggestions" class="suggestions" role="listbox" aria-label="Suggestions"></div>

      <section id="wordCard" class="word-card" aria-live="polite">
        <div class="word-row">
          <output id="selectedWord">Selected Word</output>
          <output id="wordSpelling">Spelling</output>
          <output id="wordPronunciation">Easy Pronunciation</output>
        </div>

        <p id="exampleSentence" class="sentence">Example sentence</p>

        <button id="speakButton" class="speak-button" type="button" disabled>
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M4 9v6h4l5 4V5L8 9H4z"></path>
            <path d="M16 8.5a5 5 0 0 1 0 7"></path>
            <path d="M18.5 6a8 8 0 0 1 0 12"></path>
          </svg>
          Speak
        </button>

      </section>

      <p id="lookupStatus" class="status">Pick English and start with Red, Yellow, or Blue.</p>

      <button id="submitWebllmButton" class="ai-submit-button" type="button" hidden>Generate Example Sentence</button>

      <details class="advanced-panel">
        <summary>Advanced</summary>

        <div class="advanced-group">
          <h2>Speech</h2>
          <div class="speech-controls">
            <label for="speechRateInput">
              Speed
              <span id="speechRateValue">0.82x</span>
            </label>
            <input id="speechRateInput" type="range" min="0.5" max="1.3" step="0.05" value="0.82">

            <label for="speechAccentSelect">Accent</label>
            <select id="speechAccentSelect">
              <option value="en-US">US English</option>
              <option value="en-GB">UK English</option>
              <option value="en-IN">Indian English</option>
            </select>

            <label for="speechVoiceSelect">Voice</label>
            <select id="speechVoiceSelect">
              <option value="">Browser default</option>
            </select>
          </div>
        </div>

        <div class="advanced-group" id="webllmPanel">
          <h2>WebLLM</h2>
          <div class="ai-controls">
            <select id="webllmModelSelect" aria-label="WebLLM model"></select>
            <button id="loadWebllmButton" type="button">Load</button>
          </div>
          <p id="webllmStatus" class="status">Model will load for missing words.</p>
        </div>
      </details>
    </main>

    <script src="app.js"></script>
  </body>
</html>
