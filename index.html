<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IFP Float English</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app" aria-labelledby="app-title">
      <header class="topbar">
        <h1 id="app-title">Word Helper</h1>
        <button id="clearHistoryButton" class="icon-button" type="button" title="Clear recent words" aria-label="Clear recent words">
          <span aria-hidden="true">x</span>
        </button>
      </header>

      <section class="controls" aria-label="Word controls">
        <label>
          <span>Class</span>
          <select id="classSelect"></select>
        </label>

        <label>
          <span>Subject</span>
          <select id="subjectSelect">
            <option>English</option>
            <option>Math</option>
            <option>Science</option>
            <option>Social</option>
          </select>
        </label>
      </section>

      <label class="word-field">
        <span>Word</span>
        <input id="wordInput" type="text" autocomplete="off" spellcheck="false" placeholder="Choose or type a word" aria-describedby="lookupStatus">
      </label>

      <div id="suggestions" class="suggestions" role="listbox" aria-label="Suggestions"></div>

      <section id="wordCard" class="word-card" aria-live="polite">
        <div>
          <p class="meta">Selected Word</p>
          <h2 id="selectedWord">-</h2>
        </div>

        <dl>
          <div>
            <dt>Spelling</dt>
            <dd id="wordSpelling">-</dd>
          </div>
          <div>
            <dt>Easy Pronunciation</dt>
            <dd id="wordPronunciation">-</dd>
          </div>
        </dl>

        <button id="speakButton" class="speak-button" type="button" disabled>
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M4 9v6h4l5 4V5L8 9H4z"></path>
            <path d="M16 8.5a5 5 0 0 1 0 7"></path>
            <path d="M18.5 6a8 8 0 0 1 0 12"></path>
          </svg>
          Speak
        </button>
      </section>

      <p id="lookupStatus" class="status">Pick English and start with Red, Yellow, or Blue.</p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
